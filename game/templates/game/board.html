<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkora — Hybrid AI Chess Platform</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --light-sq: #e2e8f0;
            --dark-sq: #475569;
            --sel-sq: #facc15;
            --legal-sq: rgba(56, 189, 248, 0.45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 18px; }
        header h1 { font-size: 2rem; color: var(--accent); letter-spacing: 1px; }
        header p { color: #94a3b8; font-size: 0.95rem; }
        .layout { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; max-width: 1000px; width: 100%; }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 64px);
            grid-template-rows: repeat(8, 64px);
            border: 4px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }
        .sq {
            width: 64px; height: 64px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; cursor: pointer; user-select: none;
            transition: background 0.15s;
        }
        .sq.light { background: var(--light-sq); color: #0f172a; }
        .sq.dark { background: var(--dark-sq); color: #0f172a; }
        .sq.selected { background: var(--sel-sq) !important; }
        .sq.legal { box-shadow: inset 0 0 0 4px var(--accent); background: var(--legal-sq); }
        .sidebar {
            background: var(--panel); padding: 20px; border-radius: 10px;
            width: 300px; display: flex; flex-direction: column; gap: 14px;
            border: 1px solid #334155;
        }
        .status-box { background: #0f172a; padding: 12px; border-radius: 6px; border-left: 4px solid var(--accent); font-weight: 600; }
        .controls { display: flex; gap: 10px; flex-direction: column; }
        select, button {
            padding: 10px 14px; border-radius: 6px; border: 1px solid #475569;
            background: #0f172a; color: #f8fafc; font-size: 0.95rem; cursor: pointer;
        }
        button.primary { background: var(--accent); color: #0f172a; font-weight: 700; border: none; }
        button.primary:hover { opacity: 0.9; }
        .log {
            background: #0f172a; height: 180px; overflow-y: auto; padding: 10px;
            border-radius: 6px; font-family: monospace; font-size: 0.88rem; color: #cbd5e1;
        }
        footer { margin-top: auto; padding-top: 24px; color: #64748b; font-size: 0.85rem; }
        footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>♟ CHECKORA</h1>
        <p>Hybrid C++17 & Python Minimax Alpha-Beta AI Chess Engine</p>
    </header>

    <div class="layout">
        <div id="board"></div>

        <div class="sidebar">
            <div class="status-box" id="statusText">White to move</div>

            <div class="controls">
                <label for="difficulty" style="font-size:0.85rem;color:#94a3b8;">AI Difficulty (Search Depth)</label>
                <select id="difficulty">
                    <option value="easy">Easy (Depth 1)</option>
                    <option value="medium" selected>Medium (Depth 2)</option>
                    <option value="hard">Hard (Depth 3 - Alpha-Beta)</option>
                </select>
                <button class="primary" onclick="newGame()">New Game</button>
            </div>

            <div>
                <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:6px;">Move History & Engine Telemetry</div>
                <div class="log" id="moveLog"></div>
            </div>
        </div>
    </div>

    <footer>
        Checkora AI Platform &bull; <a href="/terms/">Terms & Conditions</a>
    </footer>

    <script>
        const PIECES = {
            'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔',
            'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'
        };
        let currentFen = "";
        let legalMoves = [];
        let selectedSq = null;
        let isPlayerTurn = true;

        function fenToMatrix(fen) {
            const rows = fen.split(' ')[0].split('/');
            const board = [];
            for (const row of rows) {
                const r = [];
                for (const ch of row) {
                    if (!isNaN(ch)) {
                        for (let i = 0; i < parseInt(ch); i++) r.push('.');
                    } else {
                        r.push(ch);
                    }
                }
                board.push(r);
            }
            return board;
        }

        function rcToSq(r, c) {
            return String.fromCharCode(97 + c) + (8 - r);
        }

        function renderBoard() {
            const container = document.getElementById('board');
            container.innerHTML = '';
            if (!currentFen) return;
            const matrix = fenToMatrix(currentFen);

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sqName = rcToSq(r, c);
                    const div = document.createElement('div');
                    div.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                    if (selectedSq === sqName) div.classList.add('selected');
                    if (selectedSq && legalMoves.some(m => m.startsWith(selectedSq + sqName))) {
                        div.classList.add('legal');
                    }
                    const p = matrix[r][c];
                    if (p !== '.') div.textContent = PIECES[p] || p;
                    div.onclick = () => onSquareClick(sqName);
                    container.appendChild(div);
                }
            }
        }

        function logLine(msg) {
            const log = document.getElementById('moveLog');
            const item = document.createElement('div');
            item.textContent = msg;
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        async function onSquareClick(sq) {
            if (!isPlayerTurn) return;
            if (selectedSq && selectedSq !== sq) {
                const candidate = selectedSq + sq;
                const match = legalMoves.find(m => m === candidate || m === candidate + 'q');
                if (match) {
                    selectedSq = null;
                    await sendPlayerMove(match);
                    return;
                }
            }
            selectedSq = (selectedSq === sq) ? null : sq;
            renderBoard();
        }

        async function newGame() {
            const res = await fetch('/api/new-game/', { method: 'POST' });
            const data = await res.json();
            currentFen = data.fen;
            legalMoves = data.legal_moves;
            selectedSq = null;
            isPlayerTurn = true;
            document.getElementById('moveLog').innerHTML = '';
            document.getElementById('statusText').textContent = 'White to move (Your Turn)';
            logLine('New game initialized.');
            renderBoard();
        }

        async function sendPlayerMove(moveUci) {
            isPlayerTurn = false;
            const res = await fetch('/api/move/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fen: currentFen, move: moveUci })
            });
            const data = await res.json();
            if (data.status !== 'ok') {
                isPlayerTurn = true;
                return;
            }
            currentFen = data.fen;
            legalMoves = data.legal_moves;
            logLine(`White: ${data.san} (${moveUci})`);
            renderBoard();

            if (data.is_game_over) {
                document.getElementById('statusText').textContent = data.is_checkmate ? 'Checkmate! White wins!' : 'Game Over (Draw)';
                return;
            }

            document.getElementById('statusText').textContent = 'AI is computing move...';
            const diff = document.getElementById('difficulty').value;
            const aiRes = await fetch('/api/ai-move/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fen: currentFen, difficulty: diff })
            });
            const aiData = await aiRes.json();
            currentFen = aiData.fen;
            legalMoves = aiData.legal_moves;
            logLine(`Black (${aiData.engine_source}): ${aiData.san} (${aiData.ai_move})`);
            renderBoard();

            if (aiData.is_game_over) {
                document.getElementById('statusText').textContent = aiData.is_checkmate ? 'Checkmate! AI wins!' : 'Game Over (Draw)';
            } else {
                document.getElementById('statusText').textContent = aiData.is_check ? 'Check! White to move' : 'White to move (Your Turn)';
                isPlayerTurn = true;
            }
        }

        newGame();
    </script>
</body>
</html>
